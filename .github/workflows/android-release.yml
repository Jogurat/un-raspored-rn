name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest

    # Disabled for now. Everything below is kept intact and unmodified; flip
    # this to `true` (or drop the line) to turn the APK build back on. The OTA
    # `update` job below is unaffected and still runs on every push to main.
    if: false

    # `secrets` is not a valid context in a step's `if`, but it is at job level.
    # Resolving it to a boolean here keeps the secret itself out of the job env
    # while still letting the signing step be conditional.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: appver
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      # android/ is gitignored (Expo continuous native generation), so regenerate it.
      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      # Optional real signing. Without these secrets the APK is signed with the
      # debug keystore Expo generates: it installs fine, but cannot go to Play,
      # and it will not upgrade over a differently-signed build.
      - name: Configure release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          python3 - <<'PY'
          import pathlib

          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()

          # 1. Add a release signing config alongside the template's debug one.
          anchor = "    signingConfigs {\n        debug {"
          assert anchor in s, "unexpected signingConfigs block"
          s = s.replace(anchor,
              "    signingConfigs {\n"
              "        release {\n"
              "            storeFile file('release.keystore')\n"
              "            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')\n"
              "            keyAlias System.getenv('ANDROID_KEY_ALIAS')\n"
              "            keyPassword System.getenv('ANDROID_KEY_PASSWORD')\n"
              "        }\n"
              "        debug {", 1)

          # 2. Repoint ONLY the release build type. Walk to buildTypes first, then
          #    to the release block inside it, so the debug build type is untouched.
          old = "signingConfig signingConfigs.debug"
          bt = s.index("    buildTypes {")
          rel = s.index("release {", bt)
          hit = s.index(old, rel)
          s = s[:hit] + "signingConfig signingConfigs.release" + s[hit + len(old):]

          assert s.count("signingConfig signingConfigs.release") == 1
          assert s.count(old) == 1, "debug build type should still use the debug config"
          p.write_text(s)
          print("release signing configured")
          PY

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Name the APK
        id: apk
        run: |
          VERSION="${{ steps.appver.outputs.version }}"
          NAME="Raspored-${VERSION}-${{ github.run_number }}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" \
            "${{ steps.apk.outputs.name }}" \
            --title "Raspored ${{ steps.appver.outputs.version }} (build ${{ github.run_number }})" \
            --notes "Automated build from ${{ github.sha }}." \
            --target "${{ github.sha }}"

  # Runs in parallel with the APK build: installed apps on the `production`
  # channel pick this JS bundle up on next launch, without a reinstall. Only
  # builds whose runtimeVersion matches (appVersion policy -> app.json version)
  # are eligible, so bumping `version` cuts older builds off from new updates.
  update:
    name: OTA update
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check EAS token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set; create a token at https://expo.dev/settings/access-tokens and add it to the repository secrets."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Via env, not string interpolation: a commit message is untrusted
          # input and would otherwise be pasted straight into the shell.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE="$(printf '%s' "${COMMIT_MESSAGE:-Manual run}" | head -n 1)"
          eas update \
            --channel production \
            --platform android \
            --environment production \
            --message "$MESSAGE" \
            --non-interactive
